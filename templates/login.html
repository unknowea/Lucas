<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login • Lucas</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js">
    </script>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">

            <div class="brand-mark">L</div>

            <h1>Lucas</h1>

        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">

            Sign in to continue

        </p>

        <form
            class="auth-form"
            method="POST"
            action="/login">

            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <button
                type="submit">

                Log In

            </button>

        </form>

        <p class="alert alert-error hidden"
           id="authError">

        </p>

        <div class="divider">

            <span>OR</span>

        </div>

        <div class="social-buttons">

            <button class="btn-social btn-google">

                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z" fill="#34A853"/>
                    <path d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z" fill="#EA4335"/>
                </svg>

                Continue with Google

            </button>

            <button class="btn-social btn-github">

                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                </svg>

                Continue with GitHub

            </button>

        </div>

        <p class="footer">

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </p>

    </div>

</div>

<script>

    const firebaseConfig = {
        apiKey: "AIzaSyAVJnXy-s3vO7owCqYyUpb2EwQP8oJYJaI",

    firebase.initializeApp(firebaseConfig);

</script>

</script>

</body>

</html>
